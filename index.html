<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>柔軟性・しなりドック (Mobility & Twist Dock)</title>
    
    <!-- Google Fonts: M PLUS Rounded 1c -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white h-[100dvh] w-screen overflow-hidden flex flex-col font-rounded select-none">
    
    <!-- Background Effect -->
    <div class="sunburst absolute inset-0 z-0 pointer-events-none opacity-20"></div>

    <!-- Header -->
    <header class="relative z-20 bg-slate-900/90 border-b-4 border-slate-700 p-2 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <span class="text-3xl">🦴</span>
            <h1 class="text-xl font-black tracking-wider text-emerald-400 double-shadow">しなりドック</h1>
        </div>
        <div class="flex gap-2 text-sm font-bold">
            <div id="headerPlayerName" class="bg-slate-800 px-3 py-1 rounded-full border-2 border-slate-600 hidden">
                <span class="text-amber-400">👤 ゲスト</span>
            </div>
            <button id="btnExit" class="hidden bg-rose-500 px-3 py-1 rounded-full border-2 border-rose-800 shadow-[0_3px_0_#881337] active:translate-y-1 active:shadow-none">終了</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="relative z-10 flex-1 flex flex-col overflow-hidden">
        
        <!-- Screen: Home / Player Select -->
        <div id="screenHome" class="absolute inset-0 flex flex-col items-center justify-center p-4 bg-slate-900/95 z-50">
            <div class="brawl-panel max-w-sm w-full p-6 text-center animate-bounce-in">
                <h2 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-b from-amber-300 to-amber-600 double-shadow">MOBILITY<br>DOCK</h2>
                <p class="mb-6 font-bold text-slate-300 text-sm">完全座位・超精密可動域チェック</p>
                
                <div class="space-y-4">
                    <input type="text" id="inputPlayerName" placeholder="選手名を入力..." class="w-full bg-slate-800 border-4 border-slate-700 rounded-xl p-3 text-center text-xl font-bold focus:outline-none focus:border-emerald-500 transition-colors">
                    
                    <button id="btnStartApp" class="brawl-btn-primary w-full py-4 text-2xl">
                        START!
                    </button>
                </div>
            </div>
        </div>

        <!-- Screen: Menu -->
        <div id="screenMenu" class="absolute inset-0 flex flex-col p-4 z-40 hidden overflow-y-auto">
            <h2 class="text-2xl font-black mb-4 text-center double-shadow text-amber-400">測定メニューを選択せよ！</h2>
            <div class="grid grid-cols-1 gap-4 max-w-md mx-auto w-full pb-8">
                
                <button class="brawl-menu-btn" data-mode="hip">
                    <div class="text-left flex-1">
                        <div class="text-sm text-emerald-300 font-bold mb-1">【正面】軸足タメ・壁</div>
                        <div class="text-xl font-black double-shadow">🦊 股関節 内外旋</div>
                    </div>
                </button>

                <button class="brawl-menu-btn" data-mode="shoulder_flex">
                    <div class="text-left flex-1">
                        <div class="text-sm text-emerald-300 font-bold mb-1">【正面】肩甲骨・肘下がり防止</div>
                        <div class="text-xl font-black double-shadow">🦅 両腕バンザイ</div>
                    </div>
                </button>

                <button class="brawl-menu-btn border-amber-500!" data-mode="shoulder_gird">
                    <div class="text-left flex-1">
                        <div class="text-sm text-amber-300 font-bold mb-1">【横向き】最大しなり・障害予防</div>
                        <div class="text-xl font-black double-shadow">⚾ 肩関節 2nd 内外旋</div>
                    </div>
                </button>

                <button class="brawl-menu-btn border-amber-500!" data-mode="hamstring">
                    <div class="text-left flex-1">
                        <div class="text-sm text-amber-300 font-bold mb-1">【横向き】前傾キープ・腰痛予防</div>
                        <div class="text-xl font-black double-shadow">📐 もも裏ヒンジ前屈</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- Camera & Canvas Area (Always active behind UI when needed) -->
        <div id="cameraContainer" class="absolute inset-0 z-0 bg-black hidden">
            <!-- transform scale-x-[-1] is applied via JS based on front/back camera, default is mirror for front -->
            <video id="videoElement" class="absolute inset-0 w-full h-full object-cover transform scale-x-[-1]" playsinline autoplay muted></video>
            <canvas id="canvasOverlay" class="absolute inset-0 w-full h-full object-cover transform scale-x-[-1]"></canvas>
            
            <!-- In-game UI Overlay -->
            <div class="absolute top-4 left-0 right-0 flex justify-center z-10 pointer-events-none">
                <div id="hudMessage" class="bg-slate-900/80 border-2 border-slate-600 px-6 py-2 rounded-full font-black text-xl double-shadow text-white transition-all duration-300">
                    カメラを準備中...
                </div>
            </div>
            
            <div id="hudAngles" class="absolute bottom-20 left-4 right-4 flex justify-between z-10 pointer-events-none hidden">
                <div class="bg-slate-900/90 border-4 border-cyan-600 rounded-xl p-3 shadow-lg min-w-[100px] text-center">
                    <div class="text-cyan-400 text-xs font-bold mb-1">LEFT / 前</div>
                    <div id="angleLeft" class="text-3xl font-black text-white">--°</div>
                </div>
                <div class="bg-slate-900/90 border-4 border-rose-600 rounded-xl p-3 shadow-lg min-w-[100px] text-center">
                    <div class="text-rose-400 text-xs font-bold mb-1">RIGHT / 後</div>
                    <div id="angleRight" class="text-3xl font-black text-white">--°</div>
                </div>
            </div>
        </div>

        <!-- Screen: Result -->
        <div id="screenResult" class="absolute inset-0 flex flex-col items-center justify-center p-4 bg-slate-900/90 z-40 hidden backdrop-blur-sm">
            <div class="brawl-panel max-w-sm w-full p-6 text-center animate-pop">
                <h2 class="text-3xl font-black mb-4 text-emerald-400 double-shadow">測定完了！</h2>
                
                <div id="resultScores" class="bg-slate-800 rounded-lg p-4 mb-4 border-2 border-slate-600 space-y-2">
                    <!-- Results injected here via JS -->
                </div>

                <div id="resultEvaluation" class="text-xl font-black mb-6 double-shadow text-amber-400">
                    <!-- Evaluation injected here -->
                </div>

                <div class="flex gap-4">
                    <button id="btnBackToMenu" class="brawl-btn-secondary flex-1 py-3">メニュー</button>
                    <button id="btnGoDrill" class="brawl-btn-primary flex-1 py-3 hidden">サビ取りドリル!</button>
                </div>
            </div>
        </div>

        <!-- Screen: Drill -->
        <div id="screenDrill" class="absolute inset-0 flex flex-col items-center justify-between p-6 bg-slate-900/95 z-50 hidden">
            <div class="text-center w-full mt-10">
                <h2 class="text-3xl font-black text-amber-400 double-shadow mb-2" id="drillTitle">サビ取りドリル</h2>
                <p class="text-slate-300 font-bold" id="drillDesc">リズムに合わせて動かそう！</p>
            </div>

            <div class="relative w-64 h-64 flex items-center justify-center">
                <!-- Circular Progress / Combo -->
                <svg class="w-full h-full transform -rotate-90 absolute inset-0" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#1e293b" stroke-width="8"></circle>
                    <circle id="drillProgress" cx="50" cy="50" r="45" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="283" stroke-dashoffset="283" class="transition-all duration-200"></circle>
                </svg>
                <div class="text-center z-10">
                    <div class="text-5xl font-black text-white double-shadow" id="drillCombo">0</div>
                    <div class="text-emerald-400 font-bold">COMBO</div>
                </div>
                
                <!-- Beat indicator -->
                <div id="beatIndicator" class="absolute inset-0 border-8 border-transparent rounded-full transition-all duration-100"></div>
            </div>

            <div class="w-full space-y-4 max-w-sm">
                <div class="bg-slate-800 h-6 rounded-full overflow-hidden border-2 border-slate-600 relative">
                    <div id="ultGauge" class="h-full bg-gradient-to-r from-amber-400 to-amber-600 w-0 transition-all duration-300"></div>
                    <div class="absolute inset-0 flex items-center justify-center text-xs font-black double-shadow">ULT GAUGE</div>
                </div>
                <button id="btnCancelDrill" class="brawl-btn-secondary w-full py-3">中断する</button>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="voice.js"></script>
    <script src="biomechanics.js"></script>
    <script src="main.js"></script>
</body>
</html>
