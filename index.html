<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>柔軟性・しなりドック</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* Tailwind Config & Fallbacks */
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
  </style>
</head>
<!-- iOS Safariの幅計算バグを防ぐため、100vw/100dvhを明示的に指定 -->
<body class="bg-slate-900 text-white m-0 p-0 overflow-hidden w-screen h-screen select-none" style="width: 100vw; height: 100dvh;">
  
  <!-- App Container (全画面を強制的に確保するラッパー) -->
  <div class="flex flex-col w-full h-full relative overflow-hidden">
    
    <!-- Background Layers (CSSがなくても存在できるように配置) -->
    <div class="brawl-bg-pattern absolute inset-0 z-0 pointer-events-none opacity-20"></div>
    <div class="sunburst absolute inset-0 z-0 pointer-events-none opacity-30 mix-blend-overlay"></div>

    <!-- Header -->
    <header id="app-header" class="w-full relative z-10 flex flex-col p-2 gap-2 bg-slate-800/90 backdrop-blur-md border-b-4 border-slate-950 shrink-0">
      
      <!-- Row 1: Title & Camera Switch -->
      <div class="flex justify-between items-center w-full">
        <h1 class="text-base sm:text-lg font-black tracking-wider text-yellow-400 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">🦴 柔軟性・しなりドック</h1>
        <button id="btn-switch-camera" class="w-8 h-8 shrink-0 rounded-full bg-slate-700 border-2 border-slate-900 flex items-center justify-center shadow-[0_3px_0_#0f172a] active:translate-y-[2px] active:shadow-none transition-all">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
        </button>
      </div>
      
      <!-- Row 2: Player, Diff Badge, Carte Button -->
      <div class="flex justify-between items-center w-full gap-2">
        <!-- Player Select -->
        <button id="btn-player-select" class="flex items-center gap-1.5 bg-slate-700/80 rounded-full px-2 py-1.5 border-2 border-slate-900 shadow-[0_2px_0_#0f172a] active:translate-y-[2px] active:shadow-none transition-all flex-1 min-w-0">
          <div class="w-5 h-5 shrink-0 rounded-full bg-emerald-500 border border-emerald-900 flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
          </div>
          <span id="header-player-name" class="font-bold text-xs text-white drop-shadow truncate w-full text-left">ゲスト選手</span>
        </button>
        
        <!-- Controls Right Side -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-diff-badge" class="flex items-center gap-1 bg-purple-600/80 rounded-full px-2 py-1.5 border-2 border-purple-900 shadow-[0_2px_0_#4c1d95] active:translate-y-[2px] active:shadow-none transition-all">
            <span class="text-[10px] font-bold text-purple-200 whitespace-nowrap">左右差:</span>
            <span id="header-diff-val" class="font-bold text-xs text-white drop-shadow whitespace-nowrap">--</span>
          </button>
          
          <button id="btn-open-carte" class="w-8 h-8 shrink-0 rounded-full bg-blue-600 border-2 border-blue-900 flex items-center justify-center shadow-[0_2px_0_#1e3a8a] active:translate-y-[2px] active:shadow-none transition-all">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
          </button>
        </div>
      </div>
      
      <!-- Row 3: Tab Controls -->
      <div class="flex justify-between mt-1 gap-1 h-10 w-full">
        <button id="tab-thoracic" class="flex-1 rounded-lg bg-yellow-500 border-b-[3px] border-yellow-700 font-extrabold text-yellow-950 text-[10px] flex flex-col items-center justify-center active:border-b-0 active:translate-y-1 transition-all min-w-0">
          <span class="text-base leading-none">🦅</span>
          <span class="whitespace-nowrap scale-90 sm:scale-100">胸パカーン</span>
        </button>
        <button id="tab-hip" class="flex-1 rounded-lg bg-slate-600 border-b-[3px] border-slate-800 font-extrabold text-slate-300 text-[10px] flex flex-col items-center justify-center opacity-70 active:border-b-0 active:translate-y-1 transition-all min-w-0">
          <span class="text-base leading-none">🦀</span>
          <span class="whitespace-nowrap scale-90 sm:scale-100">股関節ワイパー</span>
        </button>
        <button id="tab-hinge" class="flex-1 rounded-lg bg-slate-600 border-b-[3px] border-slate-800 font-extrabold text-slate-300 text-[10px] flex flex-col items-center justify-center opacity-70 active:border-b-0 active:translate-y-1 transition-all min-w-0">
          <span class="text-base leading-none">🦍</span>
          <span class="whitespace-nowrap scale-90 sm:scale-100">もも裏前屈</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="brawl-panel w-full relative z-10 flex-1 flex flex-col min-h-0 bg-slate-900 overflow-hidden">
      
      <!-- Guidance Banner -->
      <div id="guidance-banner" class="absolute top-2 left-2 right-2 z-20 flex items-start gap-2 p-2 bg-slate-800/90 backdrop-blur-sm border-2 border-slate-600 rounded-xl shadow-lg transition-all duration-300">
        <div id="guide-icon" class="text-3xl leading-none mt-1 drop-shadow-md shrink-0">🦅</div>
        <div class="flex-1 min-w-0">
          <h2 id="guide-title" class="font-black text-sm text-yellow-400 drop-shadow truncate">胸椎回旋テスト（胸パカーン）</h2>
          <p id="guide-desc" class="text-[11px] text-slate-300 mt-0.5 leading-tight line-clamp-2">横向きに寝て、上の脚を前に出す。上側の腕を後ろに大きく開こう！</p>
        </div>
        <div id="pose-trigger-badge" class="shrink-0 flex flex-col items-center bg-slate-900 rounded-lg p-1 border border-slate-700 min-w-[3.5rem]">
          <div class="relative flex items-center justify-center w-6 h-6">
            <div id="trigger-dot" class="absolute w-3 h-3 bg-red-500 rounded-full animate-ping"></div>
            <div class="absolute w-3 h-3 bg-red-500 rounded-full border border-white"></div>
          </div>
          <span id="trigger-text" class="text-[9px] font-bold text-slate-400 mt-1 whitespace-nowrap">未検出</span>
        </div>
      </div>

      <!-- Camera & Canvas Wrapper -->
      <div id="camera-screen-wrapper" class="relative flex-1 w-full bg-black overflow-hidden flex items-center justify-center min-h-0">
        <video id="webcam-video" class="absolute inset-0 w-full h-full object-cover transform scale-x-[-1]" playsinline webkit-playsinline muted autoplay></video>
        <canvas id="output-canvas" class="absolute inset-0 w-full h-full object-cover z-10 transform scale-x-[-1]"></canvas>
        
        <div id="safe-boundary" class="absolute inset-4 border-2 border-dashed border-white/30 rounded-2xl z-10 pointer-events-none transition-colors duration-300"></div>
        
        <!-- Metrics Overlays -->
        <div class="absolute bottom-4 left-4 z-20">
          <div id="metric-main-val" class="bg-slate-900/80 backdrop-blur border-2 border-blue-500 rounded-xl px-3 py-1 flex flex-col items-center shadow-[0_0_15px_rgba(59,130,246,0.5)] min-w-[4rem]">
            <span class="text-[10px] font-bold text-blue-300 uppercase whitespace-nowrap">Angle</span>
            <span class="text-3xl font-black text-white leading-none drop-shadow-md">--°</span>
          </div>
        </div>
        <div class="absolute bottom-4 right-4 z-20">
          <div id="metric-sub-val" class="bg-slate-900/80 backdrop-blur border-2 border-emerald-500 rounded-xl px-3 py-1 flex flex-col items-center shadow-[0_0_15px_rgba(16,185,129,0.5)] hidden min-w-[4rem]">
            <span class="text-[10px] font-bold text-emerald-300 uppercase whitespace-nowrap">Score</span>
            <span class="text-3xl font-black text-white leading-none drop-shadow-md">--</span>
          </div>
        </div>

        <!-- Countdown -->
        <div id="countdown-box" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm hidden">
          <span id="countdown-num" class="text-9xl font-black text-yellow-400 drop-shadow-[0_4px_4px_rgba(0,0,0,1)] scale-150 transition-transform duration-300">3</span>
          <span id="countdown-guide" class="mt-4 text-xl font-bold text-white tracking-widest drop-shadow-md whitespace-nowrap">構えて！</span>
        </div>

        <!-- Measuring Badge -->
        <div id="measuring-badge" class="absolute top-24 right-4 z-20 bg-red-600/90 text-white font-black px-4 py-1.5 rounded-full border-2 border-red-900 shadow-lg animate-pulse hidden whitespace-nowrap">
          ● 測定中
        </div>

        <!-- Cheat Alert -->
        <div id="cheat-alert-badge" class="absolute top-1/4 left-1/2 -translate-x-1/2 z-20 bg-orange-600/90 backdrop-blur border-4 border-orange-900 rounded-2xl p-3 shadow-2xl flex items-center gap-2 transition-transform duration-200 scale-0 origin-bottom w-max max-w-[90%]">
          <span class="text-2xl shrink-0">⚠️</span>
          <span id="cheat-alert-text" class="font-black text-white text-lg drop-shadow-md truncate">代償動作！</span>
        </div>

        <!-- Drill HUD -->
        <div id="drill-hud" class="absolute inset-0 z-10 pointer-events-none hidden">
          <div class="absolute top-24 left-4 bg-purple-900/80 border-2 border-purple-500 rounded-xl p-2 shadow-[0_0_15px_rgba(168,85,247,0.5)]">
            <div class="text-[10px] font-bold text-purple-300">COMBO</div>
            <div id="drill-combo-counter" class="text-4xl font-black text-white leading-none">0</div>
          </div>
          <div class="absolute top-24 right-4 flex flex-col items-end">
            <div id="drill-progress-count" class="text-5xl font-black text-yellow-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] stroke-black stroke-2" style="-webkit-text-stroke: 2px black;">1:00</div>
            <div id="drill-status-text" class="text-sm font-bold text-white bg-slate-900/50 px-2 py-0.5 rounded mt-1 whitespace-nowrap">残り時間</div>
          </div>
        </div>
      </div>

      <!-- Test Controls Container -->
      <div id="test-controls-container" class="w-full relative z-20 shrink-0 bg-slate-800 p-3 pb-[env(safe-area-inset-bottom,1rem)] border-t-4 border-slate-950 flex flex-col gap-2">
        <button id="btn-start-trigger" class="w-full relative h-16 bg-gradient-to-b from-green-400 to-green-600 border-4 border-green-900 rounded-2xl flex items-center justify-center overflow-hidden shadow-[0_6px_0_#14532d] active:shadow-none active:translate-y-[6px] transition-all">
          <div class="absolute inset-0 bg-white/20 translate-y-[-50%] rounded-full blur-md"></div>
          <span class="relative z-10 font-black text-2xl text-white tracking-widest drop-shadow-[0_2px_2px_rgba(0,0,0,0.6)] whitespace-nowrap" style="-webkit-text-stroke: 1px #064e3b;">START</span>
        </button>
        <div class="flex gap-2 h-12 w-full">
          <button id="btn-open-report" class="flex-1 bg-blue-500 border-b-4 border-blue-800 rounded-xl font-bold text-white text-sm shadow-md active:border-b-0 active:translate-y-1 transition-all hidden flex items-center justify-center gap-1 whitespace-nowrap">
            <span>📊</span> レポート
          </button>
          <button id="btn-open-dynamic-drill" class="flex-1 bg-purple-500 border-b-4 border-purple-800 rounded-xl font-bold text-white text-sm shadow-md active:border-b-0 active:translate-y-1 transition-all hidden flex items-center justify-center gap-1 whitespace-nowrap">
            <span>🔥</span> 1分ドリル
          </button>
        </div>
      </div>
    </main>

    <!-- Player Registration Modal -->
    <div id="player-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
      <div class="bg-slate-800 border-4 border-slate-950 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90dvh]">
        <div class="bg-slate-900 p-3 border-b-4 border-slate-950 flex justify-between items-center shrink-0">
          <h3 class="font-black text-lg text-emerald-400">👤 選手選択・登録</h3>
          <button class="modal-close-btn w-8 h-8 shrink-0 bg-red-500 rounded-full border-2 border-red-900 font-black text-white shadow-[0_3px_0_#7f1d1d] active:shadow-none active:translate-y-[3px] flex items-center justify-center">×</button>
        </div>
        <div class="p-4 overflow-y-auto flex-1 flex flex-col gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">登録済み選手から選ぶ</label>
            <select id="player-select-dropdown" class="w-full bg-slate-700 border-2 border-slate-900 rounded-lg p-3 font-bold text-white appearance-none outline-none focus:border-emerald-500">
              <option value="">-- 選択してください --</option>
              <option value="guest" selected>ゲスト選手</option>
            </select>
          </div>
          <div class="relative flex items-center py-2">
            <div class="flex-grow border-t border-slate-600"></div>
            <span class="flex-shrink-0 mx-4 text-slate-500 text-xs font-bold">または新規登録</span>
            <div class="flex-grow border-t border-slate-600"></div>
          </div>
          <div class="flex flex-col gap-3">
            <input type="text" id="new-player-name" placeholder="なまえ（例: やまだ たろう）" class="w-full bg-slate-900 border-2 border-slate-700 rounded-lg p-3 font-bold text-white placeholder-slate-500 outline-none focus:border-emerald-500">
            <div class="flex gap-2">
              <input type="number" id="new-player-age" placeholder="年齢" class="w-1/2 bg-slate-900 border-2 border-slate-700 rounded-lg p-3 font-bold text-white placeholder-slate-500 outline-none focus:border-emerald-500">
              <select id="new-player-dominant" class="w-1/2 bg-slate-900 border-2 border-slate-700 rounded-lg p-3 font-bold text-white outline-none focus:border-emerald-500">
                <option value="right">右投げ右打ち</option>
                <option value="left">左投げ左打ち</option>
                <option value="right_left">右投げ左打ち</option>
                <option value="left_right">左投げ右打ち</option>
              </select>
            </div>
            <button id="btn-register-player" class="w-full h-12 bg-emerald-500 border-b-4 border-emerald-800 rounded-xl font-black text-white shadow-md active:border-b-0 active:translate-y-1 transition-all mt-2 whitespace-nowrap">
              ＋ 新規登録して選択
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Report Modal -->
    <div id="report-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
      <div class="bg-slate-800 border-4 border-slate-950 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col max-h-[90dvh]">
        <div class="bg-slate-900 p-3 border-b-4 border-slate-950 flex justify-between items-center shrink-0">
          <h3 class="font-black text-lg text-blue-400">📊 診断レポート</h3>
          <button class="modal-close-btn w-8 h-8 shrink-0 bg-red-500 rounded-full border-2 border-red-900 font-black text-white shadow-[0_3px_0_#7f1d1d] active:shadow-none active:translate-y-[3px] flex items-center justify-center">×</button>
        </div>
        <div class="p-4 overflow-y-auto flex-1 flex flex-col gap-5">
          
          <div class="bg-slate-900 rounded-xl p-4 border-2 border-slate-700">
            <h4 class="text-center font-black text-yellow-400 mb-2">胸椎回旋 柔軟性スコア</h4>
            <div class="flex justify-between items-end mb-1 px-1">
              <span class="text-xs font-bold text-slate-400">左(Left)</span>
              <span class="text-xs font-bold text-slate-400">右(Right)</span>
            </div>
            <div class="flex items-center gap-2 h-8">
              <!-- Left Bar -->
              <div class="flex-1 bg-slate-800 rounded-l-full h-full relative overflow-hidden flex justify-end">
                <div id="bar-left" class="bg-blue-500 h-full w-[60%] rounded-l-full transition-all duration-700 ease-out"></div>
                <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-black text-white drop-shadow-md z-10" id="report-val-left">--°</span>
              </div>
              <!-- Center Line -->
              <div class="w-1 h-full bg-slate-600 rounded-full shrink-0"></div>
              <!-- Right Bar -->
              <div class="flex-1 bg-slate-800 rounded-r-full h-full relative overflow-hidden flex justify-start">
                <div id="bar-right" class="bg-red-500 h-full w-[45%] rounded-r-full transition-all duration-700 ease-out"></div>
                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-xs font-black text-white drop-shadow-md z-10" id="report-val-right">--°</span>
              </div>
            </div>
            <div class="mt-3 flex justify-between items-center bg-slate-800 p-2 rounded-lg border border-slate-700">
              <span class="text-sm font-bold text-slate-300">左右差リスク判定</span>
              <span id="report-diff-eval" class="font-black text-orange-400">--</span>
            </div>
          </div>

          <div class="bg-slate-900 rounded-xl p-4 border-2 border-slate-700">
            <h4 class="font-black text-emerald-400 mb-2 text-sm">💡 コーチからのアドバイス</h4>
            <p id="report-advice" class="text-sm text-slate-300 leading-relaxed font-medium">診断結果に応じたアドバイスがここに表示されます。</p>
          </div>

        </div>
        <div class="bg-slate-900 p-3 border-t-4 border-slate-950 shrink-0 flex gap-2">
          <button id="btn-save-report" class="flex-1 h-12 bg-slate-600 border-b-4 border-slate-800 rounded-xl font-bold text-white shadow-md active:border-b-0 active:translate-y-1 transition-all whitespace-nowrap">
            💾 保存する
          </button>
          <button class="flex-1 h-12 bg-purple-500 border-b-4 border-purple-800 rounded-xl font-black text-white shadow-md active:border-b-0 active:translate-y-1 transition-all whitespace-nowrap">
            🔥 ドリルへGO
          </button>
        </div>
      </div>
    </div>

    <!-- Carte (History) Modal -->
    <div id="carte-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
      <div class="bg-slate-800 border-4 border-slate-950 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[90dvh]">
        <div class="bg-slate-900 p-3 border-b-4 border-slate-950 flex justify-between items-center shrink-0">
          <h3 class="font-black text-lg text-blue-400">📁 測定履歴カルテ</h3>
          <button class="modal-close-btn w-8 h-8 shrink-0 bg-red-500 rounded-full border-2 border-red-900 font-black text-white shadow-[0_3px_0_#7f1d1d] active:shadow-none active:translate-y-[3px] flex items-center justify-center">×</button>
        </div>
        
        <!-- List Container -->
        <div class="p-4 overflow-y-auto flex-1 flex flex-col gap-3" id="carte-list-container">
          <!-- Template items will be injected here dynamically -->
          <div class="text-center text-slate-500 text-sm font-bold py-10">履歴データがありません</div>
        </div>
        
        <div class="bg-slate-900 p-3 border-t-4 border-slate-950 shrink-0 flex gap-2">
          <button id="btn-export-csv" class="flex-1 h-12 bg-slate-600 border-b-4 border-slate-800 rounded-xl font-bold text-white shadow-md active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-1 whitespace-nowrap">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            CSV出力
          </button>
          <button id="btn-share-line" class="flex-1 h-12 bg-[#06C755] border-b-4 border-[#04a044] rounded-xl font-black text-white shadow-md active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-1 whitespace-nowrap">
            💬 LINE共有
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Message Box -->
    <div id="toast-box" class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] bg-slate-800 border-2 border-slate-600 text-white px-4 py-2 rounded-full font-bold shadow-xl transition-all duration-300 transform -translate-y-10 opacity-0 pointer-events-none whitespace-nowrap">
      メッセージ
    </div>

  </div> <!-- End App Container -->

  <!-- External Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
