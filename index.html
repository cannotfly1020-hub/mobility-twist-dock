<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>柔軟性・しなりドック</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sunburst"></div>
    <div id="app-container">
        <!-- ホーム画面 -->
        <section id="screen-home" class="screen active">
            <h1 class="title-text">柔軟性・しなり<br>DOCK</h1>
            <p class="subtitle">腰を回すな、胸を回せ！</p>
            <button id="btn-start" class="brawl-btn btn-emerald">測定スタート！</button>
        </section>

        <!-- 測定画面 -->
        <section id="screen-measure" class="screen hidden">
            <h2 class="section-title">胸椎＆股関節の<br>しなり測定中...</h2>
            <div class="camera-placeholder">
                <!-- ここに本来はMediaPipeのCanvasやVideoが入る -->
                <p class="status-text">姿勢を分析中...</p>
                <div class="progress-bar-container">
                    <div id="measure-progress" class="progress-bar"></div>
                </div>
            </div>
            <button id="btn-cancel" class="brawl-btn btn-amber">やめる</button>
        </section>

        <!-- 結果画面 -->
        <section id="screen-result" class="screen hidden">
            <h2 class="section-title">測定結果！</h2>
            <div id="rank-display" class="rank-badge">🌟 SUPER DRAGON</div>
            <div class="score-board">
                <p>胸椎しなり角: <span id="val-thoracic">0</span>°</p>
                <p>股関節分離度: <span id="val-hip">0</span>%</p>
            </div>
            <p id="feedback-message" class="feedback-text">最高じゃ！</p>
            <button id="btn-drill" class="brawl-btn btn-ult-gold">1分間サビ取りドリルへ</button>
        </section>

        <!-- ドリル画面 -->
        <section id="screen-drill" class="screen hidden">
            <h2 class="section-title">動的サビ取りドリル</h2>
            <div class="drill-timer">
                <span id="drill-time">60</span>秒
            </div>
            <p class="drill-instruction">胸を大きく開いてツイスト！</p>
            <button id="btn-finish-drill" class="brawl-btn btn-emerald">完了して再測定</button>
        </section>
    </div>

    <!-- モジュールの読み込み -->
    <script type="module" src="main.js"></script>
</body>
</html>
