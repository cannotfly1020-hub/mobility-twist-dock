<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>しなりドラゴン プロ v2.6.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg-navy:#030712;
    --bg-panel:#0b1220;
    --accent-lime:#c6ff3d;
    --accent-cyan:#38f0ff;
    --accent-orange:#ff8a3d;
    --accent-red:#ff4d5e;
    --accent-gold:#ffd23d;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg-navy);
    font-family:'M PLUS Rounded 1c', sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #app{ position:relative; width:100vw; height:100dvh; height:100vh; overflow:hidden; }
  #video{ position:absolute; width:1px; height:1px; opacity:0.01; pointer-events:none; }
  #outputCanvas{ position:absolute; inset:0; width:100%; height:100%; }
  .btn3d{
    border-radius:16px;
    border-bottom:5px solid rgba(0,0,0,0.45);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 6px 0 rgba(0,0,0,0.35);
    transition: transform .06s ease, box-shadow .06s ease, border-bottom-width .06s ease;
    font-weight:900;
    user-select:none;
  }
  .btn3d:active{
    transform: translateY(5px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 1px 0 rgba(0,0,0,0.3);
    border-bottom-width:1px;
  }
  .btn3d:disabled{ opacity:0.4; filter:grayscale(0.5); }
  .glass{
    background: linear-gradient(180deg, rgba(15,23,42,0.86), rgba(6,10,20,0.9));
    backdrop-filter: blur(10px);
    border: 1px solid rgba(148,163,184,0.18);
  }
  .neon-text{ text-shadow: 0 0 12px currentColor, 0 0 2px currentColor; }
  .flash-error{ animation: flashError 0.55s ease-in-out infinite; }
  @keyframes flashError{
    0%,100%{ background-color: rgba(127,29,29,0.55); }
    50%{ background-color: rgba(220,38,38,0.85); }
  }
  .pip-bob{ animation: pipBob 2.4s ease-in-out infinite; }
  @keyframes pipBob{ 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(-6px);} }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(148,163,184,0.4); border-radius:8px; }
  input[type=text], input[type=number], select{
    background:#0f172a; border:1px solid rgba(148,163,184,0.3); border-radius:12px; color:#e5e7eb;
    padding:10px 12px; font-family:inherit; font-weight:700;
  }
  .modal-scale-in{ animation: modalIn .18s ease-out; }
  @keyframes modalIn{ from{ opacity:0; transform:scale(0.92); } to{ opacity:1; transform:scale(1);} }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="outputCanvas"></canvas>

  <!-- ============ TOP SMART FLOATING HUD ============ -->
  <div id="topHud" class="absolute left-0 right-0 z-30 px-3" style="top: calc(var(--safe-t) + 8px);">
    <div id="topHudPanel" class="glass rounded-3xl px-4 py-3 mx-auto max-w-md transition-colors duration-150">

        <div class="flex items-center gap-2 min-w-0">
          <span class="text-2xl">🐉</span>
          <div class="min-w-0">
            <div class="text-white font-black text-sm leading-none truncate">しなりドラゴン プロ</div>
            <div id="stepLabel" class="text-[11px] text-lime-300 font-bold mt-1 truncate">選手を選んでスタート！</div>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="btnPlayer" class="btn3d bg-slate-700 text-white text-xs px-3 py-2">👤選手</button>
          <button id="btnHistory" class="btn3d bg-slate-700 text-white text-xs px-3 py-2">📜履歴</button>
          <button id="btnCamSwitch" class="btn3d bg-slate-700 text-white text-xs px-3 py-2">🔄</button>

      </div>

  <!-- ============ LEFT-TOP ANGLE METER ============ -->

    <div class="text-[10px] text-slate-400 font-bold" id="exerciseLabel">-</div>
    <div class="flex items-baseline gap-1">
      <span id="angleValue" class="text-3xl font-black text-white neon-text" style="color:var(--accent-cyan)">0</span>

    <div class="mt-1 text-[11px] font-bold text-orange-300">⏱ <span id="timeLeft">7.0</span>s</div>
  </div>

  <!-- ============ RIGHT-BOTTOM MODEL PIP ============ -->
  <div id="modelPip" class="absolute z-20 hidden" style="right:10px; bottom: calc(var(--safe-b) + 110px);">
    <div class="glass rounded-2xl p-1.5">
      <svg id="pipSvg" width="86" height="104" viewBox="0 0 86 104" class="pip-bob"></svg>
      <div class="text-center text-[10px] text-lime-300 font-bold -mt-1">お手本</div>

  <!-- ============ CENTER MESSAGE / WARNING ============ -->

  <!-- ============ BOTTOM CONTROL BAR ============ -->

    <div class="glass rounded-3xl px-4 py-4 mx-auto max-w-md flex flex-col items-center gap-3">
      <div id="exercisePicker" class="flex gap-2 w-full">
        <button data-ex="chest" class="exBtn btn3d flex-1 bg-slate-700 text-white text-xs py-2 px-1">①胸パカーン</button>
        <button data-ex="hip" class="exBtn btn3d flex-1 bg-slate-700 text-white text-xs py-2 px-1">②タメ絞り</button>

      </div>
    </div>

  <!-- ============ PLAYER SELECTOR MODAL ============ -->

        </div>
        <button id="btnAddPlayer" class="btn3d w-full py-3 text-sm" style="background:var(--accent-cyan); color:#04121a;">＋ 登録して選択</button>

    </div>
  </div>

  <!-- ============ HISTORY MODAL ============ -->
  <div id="historyModal" class="absolute inset-0 z-40 hidden items-center justify-center bg-black/70 px-4">
    <div class="glass rounded-3xl p-5 w-full max-w-sm modal-scale-in max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-1">
        <div class="text-white font-black text-lg">📜 測定履歴</div>
        <button id="closeHistoryModal" class="text-slate-400 text-2xl leading-none">×</button>
      </div>
      <select id="historyPlayerSelect" class="w-full mb-3"></select>
      <div id="historyList" class="flex flex-col gap-2"></div>
    </div>
  </div>

  <!-- ============ RESULT CARD ============ -->
  <div id="resultCard" class="absolute inset-0 z-40 hidden items-center justify-center bg-black/70 px-4">
    <div class="glass rounded-3xl p-6 w-full max-w-sm modal-scale-in text-center">
      <div id="resultRankEmoji" class="text-6xl mb-1">🐲</div>
      <div id="resultRankText" class="text-2xl font-black neon-text mb-2" style="color:var(--accent-gold)">SUPER DRAGON!</div>
      <div class="text-5xl font-black text-white mb-1"><span id="resultAngle">0</span>°</div>
      <div id="resultExerciseName" class="text-slate-300 font-bold text-sm mb-4">胸パカーン</div>
      <div class="flex gap-2">
        <button id="btnRetry" class="btn3d flex-1 bg-slate-700 text-white text-sm py-3">もう一度</button>
        <button id="btnResultClose" class="btn3d flex-1 py-3 text-sm" style="background:var(--accent-lime); color:#04121a;">つぎへ</button>
      </div>
    </div>
  </div>

  <!-- ============ LOADING OVERLAY ============ -->
  <div id="loadingOverlay" class="absolute inset-0 z-50 flex items-center justify-center bg-[var(--bg-navy)]">
    <div class="text-center">
      <div class="text-6xl mb-3 pip-bob">🐉</div>
      <div class="text-white font-black">よみこみちゅう…</div>
    </div>
  </div>
</div>

<script>
'use strict';

/* =========================================================================================
   0. CONSTANTS / EXERCISE DEFINITIONS
   ========================================================================================= */
const EXERCISES = {
  chest: { id:'chest', name:'①胸パカーン', shortName:'胸パカーン', pose:'seated', target:45, superTarget:48,
           metric:'胸椎回旋', cheatMsg:'膝が開いてるぞ！', instruction:'椅子に座って両ひざを閉じ、胸を左右にひねろう！' },
  hip:   { id:'hip', name:'②タメ絞り', shortName:'タメ絞り', pose:'seated', target:35, superTarget:35,
           metric:'股関節内旋', cheatMsg:'太ももが開いてるぞ！', instruction:'ひざを閉じたまま、足首だけ外へふろう！' },
  leg:   { id:'leg', name:'③床レッグレイズ', shortName:'レッグレイズ', pose:'floor', target:85, superTarget:88,
           metric:'ASLR', cheatMsg:'ひざを伸ばして！', instruction:'仰向けに寝て、ひざを伸ばしたまま片足を持ち上げよう！' }
};
const MEASURE_SECONDS = 7.0;
const CHARGE_SECONDS = 1.1;
const COUNTDOWN_STEPS = ['3','2','1','GO!'];
const VIS_THRESHOLD = 0.65;
const MIN_BODY_RATIO = 0.10; // min shoulder/torso size relative to frame
const LOST_RESET_MS = 800;

const LM = { // MediaPipe Pose landmark indices used
  NOSE:0, L_SHOULDER:11, R_SHOULDER:12, L_ELBOW:13, R_ELBOW:14,
  L_WRIST:15, R_WRIST:16, L_HIP:23, R_HIP:24, L_KNEE:25, R_KNEE:26,
  L_ANKLE:27, R_ANKLE:28
};

/* =========================================================================================
   1. BiomechanicsCore  — pure geometry/math layer. No DOM. Input: landmarks[], params.
   ========================================================================================= */
const BiomechanicsCore = (() => {

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function mid(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2, visibility: Math.min(a.visibility??1,b.visibility??1) }; }
  function vecAngleDeg(ax,ay,bx,by){
    const dot = ax*bx + ay*by;
    const magA = Math.hypot(ax,ay), magB = Math.hypot(bx,by);
    if(magA<1e-6 || magB<1e-6) return 0;
    const cos = clamp(dot/(magA*magB), -1, 1);
    return Math.acos(cos) * 180/Math.PI;
  }

  /** Confidence + scale gate to avoid "ghost" false-positive detections. */
  function isValidBody(lm, frameW, frameH){
    const need = [LM.L_SHOULDER, LM.R_SHOULDER, LM.L_HIP, LM.R_HIP, LM.L_KNEE, LM.R_KNEE];
    for(const i of need){
      if(!lm[i] || (lm[i].visibility ?? 0) < VIS_THRESHOLD) return false;
    }
    const ls = lm[LM.L_SHOULDER], rs = lm[LM.R_SHOULDER], lh = lm[LM.L_HIP], rh = lm[LM.R_HIP];
    const shoulderWidth = dist(ls, rs);           // normalized 0-1 coords
    const torsoLen = dist(mid(ls,rs), mid(lh,rh));
    if(shoulderWidth < MIN_BODY_RATIO) return false;
    if(torsoLen < MIN_BODY_RATIO) return false;
    return true;
  }

  /** ① Thoracic (chest) rotation — singularity-free compression + asymmetric-drift blend. */
  function chestRotation(lm, calib){
    const ls = lm[LM.L_SHOULDER], rs = lm[LM.R_SHOULDER], lh = lm[LM.L_HIP], rh = lm[LM.R_HIP];
    const shoulderWidth = dist(ls, rs);
    const hipWidth = Math.max(dist(lh, rh), 1e-4);
    const baseline = calib.shoulderWidthBaseline || shoulderWidth || 1e-4;

    const compressionRatio = clamp(shoulderWidth / baseline, 0.12, 1.08);
    // sqrt easing model instead of raw arccos -> stays smooth & non-zero near baseline (no 0° freeze)
    const compAngle = Math.sqrt(clamp(1 - compressionRatio*compressionRatio, 0, 1)) * 92;

    // asymmetric lateral drift of shoulder-mid vs hip-mid, normalized by hip width — responsive from frame 1
    const shoulderMidX = (ls.x + rs.x)/2;
    const hipMidX = (lh.x + rh.x)/2;
    const lateralDrift = Math.abs(shoulderMidX - hipMidX) / hipWidth;
    const driftAngle = clamp(lateralDrift * 150, 0, 95);

    const angle = compAngle*0.65 + driftAngle*0.35;

    // cheat detection: knees separating from seated-closed baseline
    const lk = lm[LM.L_KNEE], rk = lm[LM.R_KNEE];
    const kneeGap = dist(lk, rk);
    const kneeBaseline = calib.kneeGapBaseline || kneeGap || 1e-4;
    const cheat = kneeGap > kneeBaseline * 1.45 + 0.02;

    return { angle: clamp(angle,0,130), cheat };
  }

  /** ② Hip internal rotation — shin (knee->ankle) deflection while thighs stay fixed. */
  function hipInternalRotation(lm, calib, side){
    const kneeIdx = side==='L' ? LM.L_KNEE : LM.R_KNEE;
    const ankleIdx = side==='L' ? LM.L_ANKLE : LM.R_ANKLE;
    const hipIdx = side==='L' ? LM.L_HIP : LM.R_HIP;
    const knee = lm[kneeIdx], ankle = lm[ankleIdx], hip = lm[hipIdx];

    const shinX = ankle.x - knee.x;
    const shinY = ankle.y - knee.y;
    const baseShinX = calib.shinBaseX ?? shinX;
    const baseShinY = calib.shinBaseY ?? shinY;

    const angle = vecAngleDeg(shinX, shinY, baseShinX, baseShinY);

    // cheat: thighs (hip->knee vector) opening away from the seated baseline
    const thighX = knee.x - hip.x, thighY = knee.y - hip.y;
    const baseThighX = calib.thighBaseX ?? thighX;
    const baseThighY = calib.thighBaseY ?? thighY;
    const thighDeviation = vecAngleDeg(thighX, thighY, baseThighX, baseThighY);
    const cheat = thighDeviation > 12;

    return { angle: clamp(angle,0,110), cheat };
  }

  /** ③ ASLR (Active Straight Leg Raise) — floor supine, strict orientation validation. */
  function aslrValidateFloorPose(lm, frameH){
    const ls=lm[LM.L_SHOULDER], rs=lm[LM.R_SHOULDER], lh=lm[LM.L_HIP], rh=lm[LM.R_HIP];
    const lk=lm[LM.L_KNEE], rk=lm[LM.R_KNEE], la=lm[LM.L_ANKLE], ra=lm[LM.R_ANKLE];
    const shoulderMidY = (ls.y+rs.y)/2, hipMidY=(lh.y+rh.y)/2;
    const torsoHorizontal = Math.abs(shoulderMidY - hipMidY) < 0.14; // near-flat torso
    // resting leg (non-raised) should be roughly level with hips too — use the lower of the two knees as reference
    const restKneeY = Math.max(lk.y, rk.y);
    const restAnkleY = Math.max(la.y, ra.y);
    const legsLevel = Math.abs(restKneeY - hipMidY) < 0.22 && Math.abs(restAnkleY - hipMidY) < 0.30;
    // whole body should sit within the lower half of the frame (camera placed low & to the side)
    const lowestY = Math.max(ls.y, rs.y, lh.y, rh.y, lk.y, rk.y);
    const bodyInLowerHalf = lowestY > 0.30;
    return torsoHorizontal && legsLevel && bodyInLowerHalf;
  }

  function aslrAngle(lm, side){
    const hipIdx = side==='L'?LM.L_HIP:LM.R_HIP, kneeIdx = side==='L'?LM.L_KNEE:LM.R_KNEE, ankleIdx = side==='L'?LM.L_ANKLE:LM.R_ANKLE;
    const oShoulder = side==='L'?lm[LM.R_SHOULDER]:lm[LM.L_SHOULDER];
    const oHip = side==='L'?lm[LM.R_HIP]:lm[LM.L_HIP];
    const hip = lm[hipIdx], knee = lm[kneeIdx], ankle = lm[ankleIdx];

    // torso reference line (shoulder->hip on the non-lifting side, i.e. the floor line)
    const torsoX = oHip.x - oShoulder.x, torsoY = oHip.y - oShoulder.y;
    const thighX = knee.x - hip.x, thighY = knee.y - hip.y;
    const raiseAngle = vecAngleDeg(thighX, thighY, torsoX, torsoY);

    // knee straightness check (angle at the knee joint, hip-knee-ankle)
    const v1x = hip.x-knee.x, v1y = hip.y-knee.y;
    const v2x = ankle.x-knee.x, v2y = ankle.y-knee.y;
    const kneeAngle = 180 - vecAngleDeg(v1x,v1y,v2x,v2y); // 180 = fully straight
    const kneeBentCheat = kneeAngle < 145;

    return { angle: clamp(raiseAngle,0,140), kneeAngle, cheat: kneeBentCheat };
  }

  /** Master evaluate — routes to the right exercise math and returns a unified result. */
  function evaluate(exerciseId, lm, calib, side, frameW, frameH){
    if(!lm || !isValidBody(lm, frameW, frameH)){
      return { valid:false };
    }
    if(exerciseId === 'chest'){
      const r = chestRotation(lm, calib);
      return { valid:true, angle:r.angle, cheat:r.cheat };
    }
    if(exerciseId === 'hip'){
      const r = hipInternalRotation(lm, calib, side);
      return { valid:true, angle:r.angle, cheat:r.cheat };
    }
    if(exerciseId === 'leg'){
      const poseOk = aslrValidateFloorPose(lm, frameH);
      if(!poseOk) return { valid:true, angle:0, cheat:false, poseWarning:true };
      const r = aslrAngle(lm, side);
      return { valid:true, angle:r.angle, cheat:r.cheat };
    }
    return { valid:false };
  }

  /** Build a fresh calibration snapshot from a stable frame (called when CHARGING completes). */
  function buildCalibration(exerciseId, lm, side){
    const ls=lm[LM.L_SHOULDER], rs=lm[LM.R_SHOULDER], lh=lm[LM.L_HIP], rh=lm[LM.R_HIP];
    const lk=lm[LM.L_KNEE], rk=lm[LM.R_KNEE];
    const calib = {
      shoulderWidthBaseline: dist(ls,rs),
      kneeGapBaseline: dist(lk,rk)
    };
    if(exerciseId==='hip'){
      const kneeIdx = side==='L'?LM.L_KNEE:LM.R_KNEE, ankleIdx = side==='L'?LM.L_ANKLE:LM.R_ANKLE, hipIdx = side==='L'?LM.L_HIP:LM.R_HIP;
      const knee=lm[kneeIdx], ankle=lm[ankleIdx], hip=lm[hipIdx];
      calib.shinBaseX = ankle.x-knee.x; calib.shinBaseY = ankle.y-knee.y;
      calib.thighBaseX = knee.x-hip.x; calib.thighBaseY = knee.y-hip.y;
    }
    return calib;
  }

  function rankFor(exerciseId, angle){
    const ex = EXERCISES[exerciseId];
    if(angle >= ex.superTarget) return 'SUPER';
    if(angle >= ex.target) return 'CLEAR';
    if(angle >= ex.target*0.7) return 'GOOD';
    return 'TRY';
  }

  return { evaluate, buildCalibration, isValidBody, rankFor, dist, mid };
})();

/* =========================================================================================
   2. AppFSM — finite state machine controlling the measurement flow.
   ========================================================================================= */
const AppFSM = (() => {
  const STATES = ['WAITING','CHARGING','COUNTDOWN','MEASURING','FINISHED'];
  let current = 'WAITING';
  let timers = { charge:null, countdown:null, measure:null, measureInterval:null, lostReset:null };
  let listeners = {};
  const ctx = {}; // shared mutable measurement context

  function clearAllTimers(){
    Object.keys(timers).forEach(k=>{
      if(timers[k]){ clearTimeout(timers[k]); clearInterval(timers[k]); timers[k]=null; }
    });
  }

  function on(state, fn){ listeners[state] = fn; }

  function transition(next, payload){
    if(!STATES.includes(next)) return;
    clearAllTimers(); // GUARANTEE: no ghost timers survive a transition
    const prev = current;
    current = next;
    if(listeners[next]) listeners[next]({prev, payload, ctx, timers});
  }

  function get(){ return current; }

  return { transition, on, get, ctx, timers, STATES };
})();

/* =========================================================================================
   3. SoundAndVoiceEngine — Web Audio oscillators + speechSynthesis, fully self-contained.
   ========================================================================================= */
const SoundAndVoiceEngine = (() => {
  let actx = null;
  function ensureCtx(){
    if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(actx.state === 'suspended'){ actx.resume(); }
    return actx;
  }

  function tone(freq, dur, type='sine', gainPeak=0.18, delay=0){
    const ac = ensureCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type; osc.frequency.value = freq;
    osc.connect(gain); gain.connect(ac.destination);
    const t0 = ac.currentTime + delay;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainPeak, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }

  function pip(){ tone(880,0.09,'square',0.15); }
  function chargeSweep(seconds){
    const ac = ensureCtx();
    const osc = ac.createOscillator(); const gain = ac.createGain();
    osc.type='sawtooth'; osc.connect(gain); gain.connect(ac.destination);
    const t0=ac.currentTime;
    osc.frequency.setValueAtTime(220,t0);
    osc.frequency.exponentialRampToValueAtTime(660, t0+seconds);
    gain.gain.setValueAtTime(0.001,t0);
    gain.gain.linearRampToValueAtTime(0.12, t0+seconds*0.8);
    gain.gain.linearRampToValueAtTime(0.0001, t0+seconds);
    osc.start(t0); osc.stop(t0+seconds+0.05);
  }
  function whistle(){ tone(1400,0.35,'sine',0.16); tone(1800,0.3,'sine',0.1,0.05); }
  function fanfare(){
    [523,659,784,1047].forEach((f,i)=> tone(f,0.28,'triangle',0.18, i*0.11));
  }
  function buzzer(){ tone(140,0.4,'sawtooth',0.2); tone(110,0.4,'sawtooth',0.18,0.05); }
  function beep(freq=660){ tone(freq,0.12,'square',0.12); }

  let currentUtterance = null;
  function stop(){
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel(); // hard flush to prevent queue jams / duplication
    }
    currentUtterance = null;
  }
  function speak(text, opts={}){
    if(!('speechSynthesis' in window)) return;
    stop(); // always clear before speaking — one voice line owns the channel at a time
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = opts.rate || 1.05;
    u.pitch = opts.pitch || 1.15;
    currentUtterance = u;
    window.speechSynthesis.speak(u);
  }

  return { pip, chargeSweep, whistle, fanfare, buzzer, beep, speak, stop, ensureCtx };
})();

/* =========================================================================================
   4. StorageService & PlayerManagement — localStorage primary, optional Firebase mirror.
   ========================================================================================= */
const StorageService = (() => {
  const LS_PLAYERS = 'shinari_players_v1';
  const LS_RESULTS = 'shinari_results_v1';
  const LS_CURRENT = 'shinari_current_player_v1';

  // Fill this in with your own Firebase project config to enable cloud sync.
  // When left null, the app runs fully offline on localStorage (recommended default).
  const firebaseConfig = null;
  let fb = { app:null, db:null, ready:false };
  let pendingSaveQueue = [];

  function tryInitFirebase(){
    if(!firebaseConfig) return; // offline mode
    // Firebase SDK is intentionally not auto-loaded here: wire your own <script type="module">
    // firebase-app/firestore imports, then call StorageService.__attachFirebase(app, db).
  }

  function __attachFirebase(app, db){
    fb.app = app; fb.db = db; fb.ready = true;
    flushQueue();
  }

  function flushQueue(){
    if(!fb.ready || pendingSaveQueue.length===0) return;
    const queue = pendingSaveQueue.splice(0, pendingSaveQueue.length);
    queue.forEach(job => {
      try{ job(fb.db); } catch(e){ console.warn('Firestore sync failed, kept local copy', e); }
    });
  }

  function loadPlayers(){
    try{ return JSON.parse(localStorage.getItem(LS_PLAYERS) || '[]'); }catch(e){ return []; }
  }
  function savePlayers(list){ localStorage.setItem(LS_PLAYERS, JSON.stringify(list)); }

  function addPlayer({team, name, number, grade}){
    const players = loadPlayers();
    const player = { id: 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), team, name, number, grade, createdAt: Date.now() };
    players.push(player);
    savePlayers(players);
    setCurrentPlayer(player.id);
    if(fb.ready && fb.db){
      pendingSaveQueue.push(db => db.collection('players').doc(player.id).set(player));
    } else {
      pendingSaveQueue.push(db => db.collection('players').doc(player.id).set(player));
    }
    flushQueue();
    return player;
  }

  function setCurrentPlayer(id){ localStorage.setItem(LS_CURRENT, id); }
  function getCurrentPlayer(){
    const id = localStorage.getItem(LS_CURRENT);
    if(!id) return null;
    return loadPlayers().find(p=>p.id===id) || null;
  }

  function loadResults(){
    try{ return JSON.parse(localStorage.getItem(LS_RESULTS) || '[]'); }catch(e){ return []; }
  }
  function saveResult(result){
    const results = loadResults();
    results.unshift(result);
    localStorage.setItem(LS_RESULTS, JSON.stringify(results.slice(0,500)));
    const job = db => db.collection('results').add(result);
    if(fb.ready){ try{ job(fb.db); }catch(e){ pendingSaveQueue.push(job); } }
    else { pendingSaveQueue.push(job); }
  }
  function resultsForPlayer(playerId){
    return loadResults().filter(r=>r.playerId===playerId);
  }

  tryInitFirebase();
  return { loadPlayers, addPlayer, setCurrentPlayer, getCurrentPlayer, saveResult, resultsForPlayer, __attachFirebase };
})();

/* =========================================================================================
   5. ViewRenderer — Canvas / HUD drawing with Retina (DPR) correction.
   ========================================================================================= */
const ViewRenderer = (() => {
  const canvas = document.getElementById('outputCanvas');
  const ctx = canvas.getContext('2d');
  let dpr = 1, cssW = 0, cssH = 0;
  let mirrored = true;

  function resize(){
    dpr = window.devicePixelRatio || 1;
    cssW = window.innerWidth; cssH = window.innerHeight;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW+'px';
    canvas.style.height = cssH+'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr); // all subsequent drawing happens in CSS-pixel space, sharp on Retina
  }
  window.addEventListener('resize', resize);
  resize();

  function setMirror(v){ mirrored = v; }

  function clear(){ ctx.clearRect(0,0,cssW,cssH); }

  function drawVideoFrame(video){
    if(!video || video.readyState < 2) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh) return;
    // cover-fit the video into the canvas, preserving aspect ratio
    const canvasRatio = cssW/cssH, videoRatio = vw/vh;
    let dw, dh, dx, dy;
    if(videoRatio > canvasRatio){ dh = cssH; dw = dh*videoRatio; dx = (cssW-dw)/2; dy=0; }
    else { dw = cssW; dh = dw/videoRatio; dx=0; dy=(cssH-dh)/2; }
    ctx.save();
    if(mirrored){ ctx.translate(cssW,0); ctx.scale(-1,1); ctx.drawImage(video, cssW-dx-dw, dy, dw, dh); }
    else { ctx.drawImage(video, dx, dy, dw, dh); }
    ctx.restore();
    return { dx, dy, dw, dh, mirrored };
  }

  const BONES = [
    [11,12],[11,23],[12,24],[23,24],
    [11,13],[13,15],[12,14],[14,16],
    [23,25],[25,27],[24,26],[26,28]
  ];

  function toScreen(pt, proj){
    let x = proj.dx + pt.x*proj.dw;
    if(proj.mirrored) x = cssW - x;
    const y = proj.dy + pt.y*proj.dh;
    return {x,y};
  }

  function drawSkeleton(lm, proj, glowColor){
    if(!lm || !proj) return;
    ctx.save();
    ctx.lineWidth = 5; ctx.lineCap='round';
    ctx.strokeStyle = glowColor; ctx.shadowColor = glowColor; ctx.shadowBlur = 10;
    BONES.forEach(([a,b])=>{
      if(!lm[a]||!lm[b]) return;
      if((lm[a].visibility??1) < 0.4 || (lm[b].visibility??1) < 0.4) return;
      const pa = toScreen(lm[a],proj), pb = toScreen(lm[b],proj);
      ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
    });
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    [11,12,23,24,25,26,27,28,13,14].forEach(i=>{
      if(!lm[i] || (lm[i].visibility??1)<0.4) return;
      const p = toScreen(lm[i],proj);
      ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  function drawBaselineAndArc(centerPt, angleDeg, color){
    if(!centerPt) return;
    ctx.save();
    ctx.translate(centerPt.x, centerPt.y);
    // dotted 0° baseline
    ctx.setLineDash([4,6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-90,0); ctx.lineTo(90,0); ctx.stroke();
    ctx.setLineDash([]);
    // neon arc opening by the current angle
    const rad = angleDeg * Math.PI/180;
    ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,60, 0, -rad, true); ctx.stroke();
    ctx.restore();
  }

  return { resize, clear, drawVideoFrame, drawSkeleton, drawBaselineAndArc, setMirror, get canvas(){return canvas;} };
})();

/* =========================================================================================
   7. Camera / MediaPipe Pose wiring
   ========================================================================================= */
let currentFacing = 'user';
let isSwitchingCamera = false;
let mpCamera = null;
let latestLandmarks = null;
let lastValidSeenAt = 0;

const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}` });
pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  enableSegmentation: false,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
pose.onResults(onPoseResults);

async function startCamera(facing){
  if(isSwitchingCamera) return;
  isSwitchingCamera = true;
  try{
    if(mpCamera){ mpCamera.stop(); mpCamera = null; }
    // stop any existing tracks to avoid MediaStream leaks
    if(el.video.srcObject){ el.video.srcObject.getTracks().forEach(t=>t.stop()); el.video.srcObject = null; }
    mpCamera = new Camera(el.video, {
      onFrame: async () => { await pose.send({image: el.video}); },
      width: 640, height: 480, facingMode: facing
    });
    await mpCamera.start();
    currentFacing = facing;
    ViewRenderer.setMirror(facing === 'user');
    el.loadingOverlay.style.display = 'none';
  } catch(e){
    console.error('camera start failed', e);
    showCenterMsg('カメラを許可してね', 1600);
  } finally {
    isSwitchingCamera = false;
  }
}

el.btnCamSwitch.addEventListener('click', () => {
  if(isSwitchingCamera) return;
  const next = currentFacing === 'user' ? 'environment' : 'user';
  startCamera(next);
});

let lastProj = null;
function onPoseResults(results){
  ViewRenderer.clear();
  const proj = ViewRenderer.drawVideoFrame(el.video);
  lastProj = proj;
  const lm = results.poseLandmarks || null;
  const frameW = el.video.videoWidth || 640, frameH = el.video.videoHeight || 480;

  const bodyOk = lm && BiomechanicsCore.isValidBody(lm, frameW, frameH);
  if(bodyOk){
    lastValidSeenAt = performance.now();
    latestLandmarks = lm;
  } else if(performance.now() - lastValidSeenAt > LOST_RESET_MS){
    latestLandmarks = null;
    App.onBodyLost();
  }

  const glow = App.currentGlowColor();
  if(lm && proj) ViewRenderer.drawSkeleton(lm, proj, glow);

  App.onFrame(lm, bodyOk, proj);
}

/* =========================================================================================
   8. App — glue layer wiring FSM + BiomechanicsCore + ViewRenderer + Sound + Storage.
   ========================================================================================= */
const App = (() => {
  let selectedExercise = 'chest';
  let selectedSide = 'L';
  let calibration = {};
  let chargeStart = 0;
  let measureStart = 0;
  let measureEndAt = 0;
  let bestAngle = 0;
  let currentAngle = 0;
  let cheatActive = false;
  let holdActive = false;
  let currentPlayer = null;

  function currentGlowColor(){
    const s = AppFSM.get();
    if(s==='MEASURING') return cheatActive ? '#ff4d5e' : '#38f0ff';
    if(s==='COUNTDOWN') return '#ffd23d';
    return '#94a3b8';
  }

  /* ---------- exercise / side pickers ---------- */
  function refreshExerciseUI(){
    document.querySelectorAll('.exBtn').forEach(b=>{
      const active = b.dataset.ex === selectedExercise;
      b.style.background = active ? 'var(--accent-lime)' : '';
      b.style.color = active ? '#04121a' : '#fff';
    });
    const needsSide = selectedExercise !== 'chest';
    el.sideToggleWrap.classList.toggle('hidden', !needsSide);
    document.querySelectorAll('.sideBtn').forEach(b=>{
      const active = b.dataset.side === selectedSide;
      b.style.background = active ? 'var(--accent-cyan)' : '';
      b.style.color = active ? '#04121a' : '#fff';
    });
    el.exerciseLabel.textContent = EXERCISES[selectedExercise].metric;
    renderPip(selectedExercise);
    el.stepLabel.textContent = EXERCISES[selectedExercise].instruction;
  }

  document.querySelectorAll('.exBtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(AppFSM.get() !== 'WAITING') return;
      selectedExercise = b.dataset.ex;
      refreshExerciseUI();
    });
  });
  document.querySelectorAll('.sideBtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(AppFSM.get() !== 'WAITING') return;
      selectedSide = b.dataset.side;
      refreshExerciseUI();
    });
  });

  /* ---------- main action button: press & hold to charge ---------- */
  let pressTimer = null;
  function onPressStart(){
    if(AppFSM.get() !== 'WAITING') return;
    if(!latestLandmarks){ showCenterMsg('体が見えてないよ！', 1000); return; }
    AppFSM.transition('CHARGING');
  }
  function onPressEnd(){
    if(AppFSM.get() === 'CHARGING'){ AppFSM.transition('WAITING'); }
  }
  el.mainActionBtn.addEventListener('pointerdown', onPressStart);
  el.mainActionBtn.addEventListener('pointerup', onPressEnd);
  el.mainActionBtn.addEventListener('pointerleave', onPressEnd);
  el.mainActionBtn.addEventListener('pointercancel', onPressEnd);

  /* ---------- FSM state handlers ---------- */
  AppFSM.on('WAITING', () => {
    el.angleMeter.classList.add('hidden');
    el.modelPip.classList.remove('hidden');
    el.chargeBar.style.width = '0%';
    el.mainActionBtn.textContent = '📷 ホールドしてスタート';
    el.mainActionBtn.disabled = false;
    el.exercisePicker.querySelectorAll('button').forEach(b=>b.disabled=false);
    hideCheat(); flashHeaderError(false);
    SoundAndVoiceEngine.stop();
    refreshExerciseUI();
  });

  AppFSM.on('CHARGING', () => {
    chargeStart = performance.now();
    el.mainActionBtn.textContent = 'ためてるよ…！';
    el.exercisePicker.querySelectorAll('button').forEach(b=>b.disabled=true);
    SoundAndVoiceEngine.chargeSweep(CHARGE_SECONDS);
    const tick = () => {
      if(AppFSM.get() !== 'CHARGING') return;
      const t = (performance.now()-chargeStart)/1000;
      const pct = Math.min(100, (t/CHARGE_SECONDS)*100);
      el.chargeBar.style.width = pct+'%';
      if(t >= CHARGE_SECONDS){ AppFSM.transition('COUNTDOWN'); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });

  AppFSM.on('COUNTDOWN', () => {
    if(!latestLandmarks){ AppFSM.transition('WAITING'); return; }
    calibration = BiomechanicsCore.buildCalibration(selectedExercise, latestLandmarks, selectedSide);
    let step = 0;
    const showStep = () => {
      if(AppFSM.get() !== 'COUNTDOWN') return;
      if(step >= COUNTDOWN_STEPS.length){ AppFSM.transition('MEASURING'); return; }
      const label = COUNTDOWN_STEPS[step];
      showCenterMsg(label, 750);
      el.mainActionBtn.textContent = label;
      if(label==='GO!'){ SoundAndVoiceEngine.whistle(); SoundAndVoiceEngine.speak('スタート！'); }
      else { SoundAndVoiceEngine.pip(); }
      step++;
      AppFSM.timers.countdown = setTimeout(showStep, 800);
    };
    showStep();
  });

  AppFSM.on('MEASURING', () => {
    measureStart = performance.now();
    measureEndAt = measureStart + MEASURE_SECONDS*1000;
    bestAngle = 0; currentAngle = 0; cheatActive = false;
    el.angleMeter.classList.remove('hidden');
    el.modelPip.classList.add('hidden');
    el.mainActionBtn.textContent = '計測中…';
    el.chargeBar.style.background = 'linear-gradient(90deg,var(--accent-orange),var(--accent-red))';

    AppFSM.timers.measureInterval = setInterval(() => {
      if(AppFSM.get() !== 'MEASURING') return;
      const remainMs = measureEndAt - performance.now();
      const remainSec = Math.max(0, remainMs/1000);
      el.timeLeft.textContent = remainSec.toFixed(1);
      const progressPct = Math.max(0, Math.min(100, (remainMs/(MEASURE_SECONDS*1000))*100));
      el.chargeBar.style.width = progressPct+'%';
      if(remainMs <= 0){ AppFSM.transition('FINISHED'); }
    }, 60);
  });

  AppFSM.on('FINISHED', () => {
    el.chargeBar.style.background = 'linear-gradient(90deg,var(--accent-cyan),var(--accent-lime))';
    const rank = BiomechanicsCore.rankFor(selectedExercise, bestAngle);
    if(rank==='SUPER'){ SoundAndVoiceEngine.fanfare(); SoundAndVoiceEngine.speak('スーパードラゴン！すごい！'); }
    else if(rank==='CLEAR'){ SoundAndVoiceEngine.fanfare(); SoundAndVoiceEngine.speak('クリア！やったね！'); }
    else { SoundAndVoiceEngine.buzzer(); SoundAndVoiceEngine.speak('おしい！もう一回いこう！'); }

    if(currentPlayer){
      StorageService.saveResult({
        playerId: currentPlayer.id, playerName: currentPlayer.name,
        exerciseId: selectedExercise, exerciseName: EXERCISES[selectedExercise].shortName,
        side: selectedExercise==='chest' ? '-' : selectedSide,
        angle: Math.round(bestAngle*10)/10, rank, ts: Date.now()
      });
    }
    showResultCard(rank);
  });

  /* ---------- per-frame evaluation while CHARGING/MEASURING ---------- */
  function onFrame(lm, bodyOk, proj){
    const state = AppFSM.get();
    if(state !== 'MEASURING'){
      if(state==='WAITING' || state==='CHARGING'){
        // idle baseline line only, no arc
      }
      return;
    }
    if(!bodyOk){
      showCheat('体がみえないよ！');
      return;
    }
    const result = BiomechanicsCore.evaluate(selectedExercise, lm, calibration, selectedSide, el.video.videoWidth, el.video.videoHeight);
    if(!result.valid) return;

    if(result.poseWarning){
      showCheat('仰向けに寝て、横向きにスマホを置いてね');
      return;
    }

    currentAngle = result.angle;
    cheatActive = !!result.cheat;
    bestAngle = Math.max(bestAngle, currentAngle);

    el.angleValue.textContent = Math.round(currentAngle);
    el.angleValue.style.color = cheatActive ? '#ff4d5e' : '#38f0ff';
    const rank = BiomechanicsCore.rankFor(selectedExercise, currentAngle);
    el.rankBadge.textContent = rank==='SUPER' ? '🔥SUPER DRAGON' : rank==='CLEAR' ? '✅CLEAR' : rank==='GOOD' ? '💪GOOD' : '計測中…';

    if(cheatActive){
      showCheat(EXERCISES[selectedExercise].cheatMsg);
      flashHeaderError(true);
    } else {
      hideCheat();
      flashHeaderError(false);
    }

    // draw 0° baseline + neon arc at the relevant joint on-canvas
    if(proj && lm){
      const anchorIdx = selectedExercise==='chest' ? LM.L_SHOULDER : (selectedExercise==='hip' ? (selectedSide==='L'?LM.L_KNEE:LM.R_KNEE) : (selectedSide==='L'?LM.L_HIP:LM.R_HIP));
      if(lm[anchorIdx]){
        const anchorScreen = (() => {
          let x = proj.dx + lm[anchorIdx].x*proj.dw;
          if(proj.mirrored) x = window.innerWidth - x;
          const y = proj.dy + lm[anchorIdx].y*proj.dh;
          return {x,y};
        })();
        ViewRenderer.drawBaselineAndArc(anchorScreen, currentAngle, cheatActive ? '#ff4d5e' : '#38f0ff');
      }
    }
  }

  function onBodyLost(){
    const state = AppFSM.get();
    if(state==='CHARGING' || state==='COUNTDOWN' || state==='MEASURING'){
      showCenterMsg('体が見えなくなったよ！', 1000);
      AppFSM.transition('WAITING');
    }
  }

  /* ---------- result card / retry ---------- */
  function showResultCard(rank){
    $('#resultAngle').textContent = Math.round(bestAngle);
    $('#resultExerciseName').textContent = EXERCISES[selectedExercise].shortName + (selectedExercise!=='chest' ? `（${selectedSide==='L'?'左':'右'}）` : '');
    const emoji = rank==='SUPER' ? '🐲' : rank==='CLEAR' ? '🐉' : rank==='GOOD' ? '🙂' : '🌀';
    const text = rank==='SUPER' ? 'SUPER DRAGON!!' : rank==='CLEAR' ? 'CLEAR!' : rank==='GOOD' ? 'GOOD TRY!' : 'もう一息！';
    $('#resultRankEmoji').textContent = emoji;
    $('#resultRankText').textContent = text;
    el.resultCard.classList.remove('hidden'); el.resultCard.classList.add('flex');
  }
  $('#btnRetry').addEventListener('click', () => {
    el.resultCard.classList.add('hidden'); el.resultCard.classList.remove('flex');
    AppFSM.transition('WAITING');
  });
  $('#btnResultClose').addEventListener('click', () => {
    el.resultCard.classList.add('hidden'); el.resultCard.classList.remove('flex');
    const order = ['chest','hip','leg'];
    const idx = order.indexOf(selectedExercise);
    selectedExercise = order[(idx+1)%order.length];
    AppFSM.transition('WAITING');
  });

  /* ---------- player management ---------- */
  function refreshPlayerList(){
    const players = StorageService.loadPlayers();
    const cur = StorageService.getCurrentPlayer();
    const list = $('#playerList');
    list.innerHTML = '';
    if(players.length===0){
      list.innerHTML = '<div class="text-slate-400 text-sm text-center py-3">まだ選手が登録されていません</div>';
    }
    players.forEach(p=>{
      const active = cur && cur.id===p.id;
      const row = document.createElement('button');
      row.className = 'btn3d w-full text-left px-4 py-3 flex items-center justify-between '+(active?'':'bg-slate-700');
      row.style.background = active ? 'var(--accent-lime)' : '';
      row.style.color = active ? '#04121a' : '#fff';
      row.innerHTML = `<span class="font-black">#${p.number||'-'} ${p.name}</span><span class="text-xs opacity-70">${p.team||''} ${p.grade||''}</span>`;
      row.addEventListener('click', ()=>{
        StorageService.setCurrentPlayer(p.id);
        currentPlayer = p;
        updatePlayerHeader();
        refreshPlayerList();
      });
      list.appendChild(row);
    });
  }
  function updatePlayerHeader(){
    currentPlayer = StorageService.getCurrentPlayer();
    if(currentPlayer){
      el.stepLabel.textContent = `${currentPlayer.name} 選手 準備OK！`;
    }
  }
  $('#btnPlayer').addEventListener('click', () => { refreshPlayerList(); el.playerModal.classList.remove('hidden'); el.playerModal.classList.add('flex'); });
  $('#closePlayerModal').addEventListener('click', () => { el.playerModal.classList.add('hidden'); el.playerModal.classList.remove('flex'); refreshExerciseUI(); });
  $('#btnAddPlayer').addEventListener('click', () => {
    const name = $('#inputName').value.trim();
    if(!name){ showCenterMsg('選手名を入力してね', 1200); return; }
    const player = StorageService.addPlayer({
      team: $('#inputTeam').value.trim(), name,
      number: $('#inputNumber').value.trim(), grade: $('#inputGrade').value
    });
    currentPlayer = player;
    $('#inputTeam').value=''; $('#inputName').value=''; $('#inputNumber').value=''; $('#inputGrade').value='';
    updatePlayerHeader();
    refreshPlayerList();
  });

  /* ---------- history modal ---------- */
  function refreshHistorySelect(){
    const players = StorageService.loadPlayers();
    const sel = $('#historyPlayerSelect');
    sel.innerHTML = players.map(p=>`<option value="${p.id}">${p.name}（${p.team||''}）</option>`).join('') || '<option value="">選手が未登録です</option>';
    const cur = StorageService.getCurrentPlayer();
    if(cur) sel.value = cur.id;
    renderHistoryList(sel.value);
  }
  function renderHistoryList(playerId){
    const list = $('#historyList');
    if(!playerId){ list.innerHTML = '<div class="text-slate-400 text-sm text-center py-4">選手を登録してね</div>'; return; }
    const results = StorageService.resultsForPlayer(playerId);
    if(results.length===0){ list.innerHTML = '<div class="text-slate-400 text-sm text-center py-4">まだ記録がありません</div>'; return; }
    list.innerHTML = results.map(r=>{
      const d = new Date(r.ts);
      const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const rankColor = r.rank==='SUPER' ? '#ffd23d' : r.rank==='CLEAR' ? '#c6ff3d' : '#94a3b8';
      return `<div class="glass rounded-xl px-3 py-2 flex items-center justify-between">
        <div>
          <div class="text-white text-sm font-bold">${r.exerciseName} ${r.side!=='-'?`（${r.side==='L'?'左':'右'}）`:''}</div>
          <div class="text-slate-400 text-[11px]">${dateStr}</div>
        </div>
        <div class="text-right">
          <div class="text-lg font-black text-white">${r.angle}°</div>
          <div class="text-[10px] font-bold" style="color:${rankColor}">${r.rank}</div>
        </div>
      </div>`;
    }).join('');
  }
  $('#btnHistory').addEventListener('click', () => { refreshHistorySelect(); el.historyModal.classList.remove('hidden'); el.historyModal.classList.add('flex'); });
  $('#closeHistoryModal').addEventListener('click', () => { el.historyModal.classList.add('hidden'); el.historyModal.classList.remove('flex'); });
  $('#historyPlayerSelect').addEventListener('change', (e)=> renderHistoryList(e.target.value));

  function init(){
    currentPlayer = StorageService.getCurrentPlayer();
    updatePlayerHeader();
    refreshExerciseUI();
    AppFSM.transition('WAITING');
  }

  return { onFrame, onBodyLost, currentGlowColor, init };
})();

/* =========================================================================================
   9. Boot
   ========================================================================================= */
window.addEventListener('load', () => {
  App.init();
  startCamera('user');
});
window.addEventListener('beforeunload', () => { SoundAndVoiceEngine.stop(); });
</script>
</body>
</html>
